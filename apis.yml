aid: luel
name: Luel
description: >-
  Luel is a two-sided marketplace and multi-modal data lab for AI training data,
  connecting companies that need high-quality, rights-cleared datasets with
  verified contributors who supply and license on-demand video, audio, and image
  data. Contributors can earn money by submitting media from their own devices
  (for example, footage from their camera roll) or by completing requested data
  tasks, while buyers purchase premium, curated, rights-cleared multimodal
  datasets from the Luel catalog. Positioned as "the frontier of data," Luel
  powers the foundations of machine perception through a proprietary, continuous
  data engine. The company is backed by Y Combinator, General Catalyst, and
  Lightspeed Venture Partners. Luel does not currently publish a public API,
  SDK, or developer documentation surface.
